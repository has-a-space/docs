input: ./src
output: .retype
url: docs.has-a.space
branding:
  title: has-a.space Docs
  logo: /media/collar.svg
  logoAlign: left
  colors:
    label:
      text: "#ffffff"
      background: "#22c55e"
links:
  - text: Home
    link: index.md
    icon: home
  - text: Website
    link: https://has-a.space
    icon: globe
  - text: Register
    link: https://github.com/has-a-space/register
    icon: mark-github
    target: blank
  - text: Discord
    link: https://discord.gg/KFEN5E3PyR
    icon: comment-discussion
    target: blank
edit:
  repo: "https://github.com/has-a-space/docs"
  base: "/src"
  branch: "main"
  label: "Edit this page"
editor:
  enabled: true
favicon: /media/collar.svg
generator:
  recase: all
markdown:
  lineBreaks: soft
meta:
  title: " | has-a.space Docs"
search:
  hotkeys:
    - "/"
  maxResults: 20
  minChars: 2
  mode: full
  noResultsFoundMsg: "No results"
  placeholder: Search
start:
  open: false
snippets:
  lineNumbers:
    - js
    - none
templating:
  enabled: true
  liquid: false
footer:
  copyright: "&copy; {{ year }} has-a.space. Based on the is-a.dev docs (GPL-3.0)."
  links:
    - text: has-a-space/docs
      link: https://github.com/has-a-space/docs
